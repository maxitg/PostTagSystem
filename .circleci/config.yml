version: 2.1

orbs:
  win: circleci/windows@2.2.0

jobs:
  wolfram-language-paclet-test:
    docker:
      - image: wolframresearch/wolframengine:15.0.0
        user: root
    resource_class: large # The history-test report exceeds the default container memory.
    parallelism: 4

    steps:
      - run:
          name: Install Required Tools
          command: |
            apt-get update
            apt-get install --no-install-recommends -y g++ git openssh-client

      - checkout

      - run:
          name: Activate Wolfram Engine
          command: |
            : "${WOLFRAM_ID:?Set WOLFRAM_ID in CircleCI project settings}"
            : "${WOLFRAM_PASSWORD:?Set WOLFRAM_PASSWORD in CircleCI project settings}"
            wolframscript -authenticate "${WOLFRAM_ID}" "${WOLFRAM_PASSWORD}"
            wolframscript -activate

      - run:
          name: Build
          command: ./build.wls

      - store_artifacts:
          path: ./LibraryResources/

      - attach_workspace:
          at: /tmp/workspace

      - run:
          name: Copy libraries from other platforms
          command: cp -r /tmp/workspace/* ./LibraryResources/

      - run:
          name: Install
          command: ./install.wls

      - store_artifacts:
          path: ./BuiltPaclets/

      - run:
          name: Reinstall
          command: ./install.wls

      - run:
          name: Test
          no_output_timeout: 20m
          command: |
            testsToRun=$(circleci tests glob "Tests/*.wlt" \
              | circleci tests split --total=4 --split-by=filesize \
              | sed "s/\.wlt//" \
              | sed "s/Tests\///")
            ./.circleci/test.sh $testsToRun

  cpp-test:
    docker:
      - image: alpine:3.12.1
        auth:
          username: maxitg
          password: $DOCKERHUB_PASSWORD

    steps:
      - run:
          name: Install checkout tools
          command: apk add --no-cache git openssh-client

      - checkout

      - run:
          name: Install Required Tools
          command: |
            apk add --no-cache \
              bash boost-dev boost-static git g++ make cmake \
              clang py-pip shellcheck shfmt grep npm
            pip install cpplint==1.5.5
            npm install -g markdownlint-cli

      - run:
          name: Lint
          command: |
            set +eo pipefail
            ./lint.sh
            if [ $? -ne 0 ]
            then
              echo "Please run scripts/install_git_hooks.sh to detect linting issues before git push."
              exit 1
            fi

      - run:
          name: Build
          command: |
            mkdir build
            cd build
            cmake .. -DPOST_TAG_SYSTEM_BUILD_TESTING=ON \
                     -DPOST_TAG_SYSTEM_BUILD_CLI=ON \
                     -DPOST_TAG_SYSTEM_ENABLE_ALLWARNINGS=ON
            cmake --build .

      - run:
          name: Test
          command: ./libPostTagSystemTest.sh

      - store_test_results:
          path: TestResults

  cpp-32-test:
    docker:
      - image: i386/alpine:3.12.1
        auth:
          username: maxitg
          password: $DOCKERHUB_PASSWORD

    steps:
      - run:
          name: Install checkout tools
          command: apk add --no-cache git openssh-client

      - checkout

      - run:
          name: Install Required Tools
          command: apk add --no-cache bash boost-dev boost-static git g++ make cmake

      - run:
          name: Build
          command: |
            mkdir build
            cd build
            cmake .. -DPOST_TAG_SYSTEM_BUILD_TESTING=ON \
                     -DPOST_TAG_SYSTEM_BUILD_CLI=ON \
                     -DPOST_TAG_SYSTEM_ENABLE_ALLWARNINGS=ON
            cmake --build .

      - run:
          name: Test
          command: ./libPostTagSystemTest.sh

      - store_test_results:
          path: TestResults

  macos-build:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium

    steps:
      - checkout

      - run:
          name: Install CMake
          command: command -v cmake >/dev/null || brew install cmake

      - run:
          name: Build
          command: scripts/buildLibraryResources.sh

      - persist_to_workspace:
          root: LibraryResources
          paths:
            - MacOSX-x86-64
            - MacOSX-ARM64

      - store_artifacts:
          path: ./LibraryResources/

  windows-build:
    executor:
      name: win/default
      shell: bash.exe -eo pipefail

    steps:
      - checkout

      - run:
          name: Install CMake
          command: |
            cmakeURL="https://github.com/Kitware/CMake/releases/download/v3.18.6/cmake-3.18.6-win64-x64.zip"
            curl --fail --location --retry 3 --output cmake.zip "$cmakeURL"
            unzip -q cmake.zip
            cmakeDir=cmake-3.18.6-win64-x64
            echo "export PATH=\"$(pwd)/$cmakeDir/bin:$PATH\"" >> $BASH_ENV

      - run:
          name: Install Boost headers and build libraries
          command: |
            boostURL="https://archives.boost.io/release/1.72.0/source/boost_1_72_0.zip"
            curl --fail --location --retry 3 --output boost.zip "$boostURL"
            unzip -q boost.zip
            boostDir=boost_1_72_0
            echo "export BOOST_ROOT=\"$(pwd)/$boostDir\"" >> $BASH_ENV
            grep BOOST_ $BASH_ENV
            cd "$boostDir"
            ./bootstrap.bat
            ./b2 --with-program_options

      - run:
          name: Build
          command: scripts/buildLibraryResources.sh

      - persist_to_workspace:
          root: LibraryResources
          paths:
            - Windows-x86-64

      - store_artifacts:
          path: ./LibraryResources/

      - run:
          name: Build
          command: |
            rm -rf build
            mkdir -p build
            cd build
            cmake .. \
              -DPOST_TAG_SYSTEM_ENABLE_ALLWARNINGS=ON \
              -DPOST_TAG_SYSTEM_BUILD_CLI=ON \
              -DPOST_TAG_SYSTEM_CLI_STATIC_BUILD=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release

      - store_artifacts:
          path: ./build/CLI/Release

workflows:
  version: 2
  build-and-test:
    jobs:
      - macos-build
      - windows-build
      - cpp-test
      - cpp-32-test
      - wolfram-language-paclet-test:
          requires:
            - macos-build
            - windows-build
